# content of: tox.ini , put in same dir as setup.py
[tox]
envlist = py315

[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

[testenv]
deps=
    pytest
    coverage
    pytest-cov
    pytest-asyncio
    pytest-aiohttp
setenv =
    REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
recreate = True
commands=
    python --version
    python -m pytest -s --cov policysync --cov-report=xml --cov-report=term tests --verbose

[testenv:lint]
deps =
    flake8
    pylint
commands =
    flake8 policysync
    pylint policysync